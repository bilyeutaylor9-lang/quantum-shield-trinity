name: Quantum Shield Trinity Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Quantum Shield Trinity scan
        run: npm run scan -- . > quantum-shield-report.txt

      - name: Publish latest HTML report to docs
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p docs/results
          cp report.html docs/results/index.html

      - name: Commit latest public report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/results/index.html
          git commit -m "Publish latest scan report" || echo "No report changes to commit"
          git push

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantum-shield-trinity-reports
          path: |
            quantum-shield-report.txt
            report.html
            report.json
            executive-report.json
            report.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
