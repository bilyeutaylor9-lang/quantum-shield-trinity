name: Quantum Shield Trinity Scan

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/results/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scan_target:
        description: "Directory path or GitHub repository URL to scan"
        required: false
        default: "src"

permissions:
  contents: write
  actions: read
  security-events: write

concurrency:
  group: quantum-shield-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Run Quantum Shield Trinity
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NODE_OPTIONS: "--max-old-space-size=12288"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify environment
        run: |
          node --version
          npm --version
          git --version
          echo "NODE_OPTIONS=$NODE_OPTIONS"
          node -e "console.log('Heap Limit MB:', Math.round(require('v8').getHeapStatistics().heap_size_limit / 1024 / 1024))"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Determine scan target
        id: target
        shell: bash
        run: |
          TARGET="${{ github.event.inputs.scan_target || 'src' }}"
          if [ -z "$TARGET" ]; then
            TARGET="src"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Scan target: $TARGET"

      - name: Run Quantum Shield Trinity Scan
        shell: bash
        run: |
          npm run scan -- "${{ steps.target.outputs.target }}" 2>&1 | tee quantum-shield-report.txt

      - name: Verify generated reports
        if: always()
        shell: bash
        run: |
          echo "=== Current files ==="
          ls -lah

          echo ""
          echo "=== Report files found ==="
          find . -maxdepth 3 \( -name "*.json" -o -name "*.html" -o -name "*.sarif" -o -name "*.svg" -o -name "*.txt" \) -print || true

      - name: Publish latest HTML report to docs
        if: github.event_name != 'pull_request' && hashFiles('report.html') != ''
        shell: bash
        run: |
          mkdir -p docs/results
          cp report.html docs/results/index.html

          if [ -f badge.svg ]; then
            cp badge.svg docs/results/badge.svg
          fi

          if [ -f report.json ]; then
            cp report.json docs/results/report.json
          fi

      - name: Commit latest public report
        if: github.event_name != 'pull_request' && hashFiles('docs/results/index.html') != ''
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/results

          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "Publish latest Quantum Shield Trinity report [skip ci]"
            git push
          fi

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantum-shield-trinity-reports
          retention-days: 30
          if-no-files-found: warn
          path: |
            quantum-shield-report.txt
            report.html
            report.json
            executive-report.json
            executive-summary.json
            report.sarif
            badge.svg
            badge.html
            badge.json
            evidence-graph.json
            wallet-risk-report.json
            dependency-risk-report.json
            migration-shield-report.json
            quantum-risk-export.json
            smart-contract-context-report.json
            quantum-exposure-forecast-report.json
            quantum-attack-simulation-report.json
            root-cause-report.json
            security-assessment-report.json
            security-audit-loop-report.json
            security-copilot-report.json
            code-flow-report.json
            route-exposure-report.json
            trust-boundary-report.json
            attack-chain-builder-report.json

      - name: Upload SARIF to GitHub Code Scanning
        if: hashFiles('report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif

      - name: Scan summary
        if: always()
        shell: bash
        run: |
          echo "# Quantum Shield Trinity Scan Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target:** \`${{ steps.target.outputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Reports Generated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### JSON" >> "$GITHUB_STEP_SUMMARY"
          ls -1 *.json 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "No JSON reports found." >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### HTML" >> "$GITHUB_STEP_SUMMARY"
          ls -1 *.html 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "No HTML reports found." >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SARIF" >> "$GITHUB_STEP_SUMMARY"
          ls -1 *.sarif 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "No SARIF report found." >> "$GITHUB_STEP_SUMMARY"
