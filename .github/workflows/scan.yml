name: Quantum Shield Trinity Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Quantum Shield Trinity scan
        run: npm run scan -- . > quantum-shield-report.txt

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: quantum-shield-report
          path: quantum-shield-report.txt
